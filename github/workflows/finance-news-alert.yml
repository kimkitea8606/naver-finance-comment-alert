name: NAVER Finance News Comment Alert
on:
  schedule:
    # 한국시간 평일 08:15~20:15, 2시간 간격 (UTC 기준은 필요시 아래 timezone 사용)
    - cron: '15 8,10,12,14,16,18,20 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-finance-news-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check finance news and notify
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save sent-article IDs to avoid duplicates
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent news IDs [skip ci]"
            git push
          fi
